name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ── 依赖版本（MC 26.1.2）────────────────────────────
# 项目 gradle.properties 未定义这些属性，必须通过 -P 传入，
# 否则 Gradle 配置阶段会直接报错。如遇版本冲突请调整此处。
env:
  MC_VERSION: '26.1.2'
  PAPER_VERSION: '26.1.2.build.74-stable'      # 已从 repo.papermc.io 确认存在
  LOADER_VERSION: '0.18.0'          # fabric.mod.json 要求 >=0.18.0
  FABRIC_API_VERSION: '0.155.2+26.1.2'   # 已从 maven.fabricmc.net 确认存在
  REFLECTION_REMAPPER_VERSION: '0.1.3'       # 已从 Maven Central 确认存在
  CLOTH_CONFIG_VERSION: '26.1.154'       # 已从 maven.shedaniel.me 确认存在
  MODMENU_VERSION: '18.0.0'
  MIXINEXTRAS_VERSION: '0.4.1'
  FABRIC_PERMISSIONS_API_VERSION: '0.3.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric + Paper
        run: |
          # 修复 Windows CRLF 换行符导致的 "required file not found"
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew spectatorplus-fabric:build spectatorplus-paper:build \
            -Ppaper_version="${{ env.PAPER_VERSION }}" \
            -Pminecraft_version="${{ env.MC_VERSION }}" \
            -Ploader_version="${{ env.LOADER_VERSION }}" \
            -Pfabric_version="${{ env.FABRIC_API_VERSION }}" \
            -Preflection_remapper_version="${{ env.REFLECTION_REMAPPER_VERSION }}" \
            -Pcloth_config_version="${{ env.CLOTH_CONFIG_VERSION }}" \
            -Pmodmenu_version="${{ env.MODMENU_VERSION }}" \
            -Pmixinextras_version="${{ env.MIXINEXTRAS_VERSION }}" \
            -Pfabric_permissions_api_version="${{ env.FABRIC_PERMISSIONS_API_VERSION }}" \
            -Pbuild.type=RELEASE

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectatorplus-fabric
          path: fabric/build/libs/*.jar

      - name: Upload Paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectatorplus-paper
          path: paper/build/libs/*.jar

      - name: Determine release tag
        id: get_tag
        run: |
          if [ -f UPSTREAM_TAG ]; then
            TAG=$(cat UPSTREAM_TAG)
            echo "Using upstream tag: ${TAG}"
          else
            TAG="v${{ github.run_number }}"
            echo "No upstream tag found, using run number: ${TAG}"
          fi
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Release ${{ steps.get_tag.outputs.release_tag }}"
          tag_name: "${{ steps.get_tag.outputs.release_tag }}"
          files: |
            fabric/build/libs/*.jar
            paper/build/libs/*.jar
